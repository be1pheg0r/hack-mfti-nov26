defaults:
  - llm@llm
  - feature_extraction@feature_extraction
  - first_gate@first_gate
  - _self_

llm:
  max_tokens: 16384
server:
  port: 18765
  bind: 127.0.0.1
  public_origin: ''
  reload: true
  cache_dir: .data/mfti_demo/demo_cache
  extra_vacancies_path: .data/mfti_demo/vacancies.json
  matching_gt_path: public_data/mfti_matching_gt
  real_resumes_enabled: false
  real_resumes_path: .data/mfti_real_work
pipeline:
  embedding_url: http://127.0.0.1:18766
  embedding_timeout: 120
  shortlist_size: 10
  demo_delay_seconds: 0.2
auth:
  token_env: VRSCORE_DEMO_TOKEN
  min_token_length: 24
