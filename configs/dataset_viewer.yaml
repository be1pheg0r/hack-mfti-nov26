dataset_dir: .data/trudvsem_mini
# Compatible direct children are discovered on server startup. Set null to disable.
discovery_root: .data
extra_datasets:
  medium: .data/trudvsem_medium
  mfti_matching_gt: public_data/mfti_matching_gt
assets_dir: vrscore/web/dataset_viewer
server:
  host: 127.0.0.1
  port: 8787
  allowed_hosts: []
  allow_private_bind: false
hydra:
  run:
    dir: .data/dataset_viewer/runs/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
