# Изменяйте значения через Hydra overrides перед созданием контрактов.
postprocessing:
  rules: [sum_experience]
  vacancy_rules: [location_mobility_by_format]
# Vacancy output fields have fixed category and priority; the model fills values only.
vacancy_template:
  experience: {category: experience, importance: strict, description: Explicit mandatory minimum work experience in years; not optional experience.}
  preferred_experience: {category: experience, importance: honestly_desired, description: Experience explicitly described as optional or an advantage.}
  hard_skill: {category: hard_skill, importance: good2have, description: Skills requested for the role unless explicitly presented as an advantage.}
  preferred_hard_skill: {category: hard_skill, importance: honestly_desired, description: Skills explicitly optional or an advantage.}
  soft_skill: {category: soft_skill, importance: good2have, description: Requested interpersonal and organizational skills.}
  preferred_soft_skill: {category: soft_skill, importance: honestly_desired, description: Interpersonal skills explicitly optional or an advantage.}
  language: {category: language, importance: good2have, description: Languages requested for the role.}
  preferred_language: {category: language, importance: honestly_desired, description: Languages explicitly optional or an advantage.}
  education: {category: education, importance: strict, description: Education level.}
  education_specialization: {category: education_specialization, importance: null, description: Educational specialization.}
  certification: {category: certification, importance: null, description: Certifications or permits.}
  language_level: {category: language_level, importance: null, description: Language level.}
  work_schedule: {category: work_schedule, importance: strict, description: Work schedule.}
  work_format: {category: work_format, importance: strict, description: Work format.}
  employment_type: {category: employment_type, importance: null, description: Employment type.}
  location: {category: location, importance: null, description: Work location.}
  mobility: {category: mobility, importance: null, description: Travel or relocation.}
  position_name: {category: position_name, importance: null, description: Role title.}
  typical_position: {category: typical_position, importance: null, description: Professional area.}
  salary_min: {category: salary_min, importance: null, description: Salary minimum.}
  salary_max: {category: salary_max, importance: null, description: Salary maximum.}
  other: {category: other, importance: null, description: Other explicitly stated requirements and conditions.}
labels:
  education: Образование
  education_specialization: Специальность
  experience: Опыт работы
  hard_skill: Профессиональный навык
  soft_skill: Личное качество
  language: Язык
  language_level: Уровень языка
  certification: Сертификат
  work_schedule: График работы
  work_format: Формат работы
  employment_type: Занятость
  location: Местоположение
  mobility: Мобильность
  position_name: Должность
  typical_position: Направление
  salary_min: Зарплата от
  salary_max: Зарплата до
  other: Другое
vocabulary:
  importance:
    strict: Жёсткий фильтр; нарушение подтверждённого требования исключает вакансию.
    good2have: Основное запрашиваемое умение, не автоматический отсев.
    honestly_desired: Необязательное пожелание или дополнительное преимущество.
  categories:
    education:
      description: Уровень или вид образования.
      value_type: enum
      values:
        secondary_general: Среднее общее образование.
        secondary_vocational: Среднее профессиональное образование.
        higher: Высшее образование без уточнения степени.
        bachelor: Бакалавриат.
        specialist: Специалитет.
        master: Магистратура.
        postgraduate: Аспирантура или эквивалентная ступень.
        special: Специальное образование без уточнения уровня.
    education_specialization:
      description: Направление или специальность образования.
      value_type: text
    experience:
      description: Минимальный опыт работы в годах; область указывается в context.
      value_type: number
    hard_skill:
      description: Профессиональный навык, технология или инструмент.
      value_type: text
    soft_skill:
      description: Навык взаимодействия или организации работы.
      value_type: text
    language:
      description: Иностранный или другой язык; уровень указывается в context.
      value_type: text
    certification:
      description: Сертификат, разрешение или иная квалификация.
      value_type: text
    work_schedule:
      description: Режим или график работы, необходимый для вакансии.
      value_type: enum
      values:
        full_time: Полный рабочий день.
        part_time: Неполный рабочий день.
        shift: Сменный график.
        flexible: Гибкий график.
        rotation: Вахтовый метод.
    work_format:
      description: Формат организации рабочего места.
      value_type: enum
      values:
        on_site: Работа на месте.
        remote: Удалённая работа.
        hybrid: Гибридный формат.
    employment_type:
      description: Требуемый тип занятости.
      value_type: enum
      values:
        full_time: Полная занятость.
        part_time: Частичная занятость.
        internship: Стажировка.
        project: Проектная работа.
        contract: Работа по договору.
    language_level:
      description: Уровень языка по общеевропейской шкале; язык указан в context.
      value_type: enum
      values:
        a1: A1.
        a2: A2.
        b1: B1.
        b2: B2.
        c1: C1.
        c2: C2.
    location:
      description: Требование к месту работы или географической доступности.
      value_type: text
    mobility:
      description: Готовность или отказ от переезда и командировок, с контекстом.
      value_type: text
    position_name:
      description: Указанная должность или профессиональная роль.
      value_type: text
    typical_position:
      description: Указанное профессиональное направление.
      value_type: text
    salary_min:
      description: Нижняя граница ожидаемой заработной платы.
      value_type: number
    salary_max:
      description: Верхняя граница ожидаемой заработной платы.
      value_type: number
    other:
      description: Явное требование, которое не относится к другим категориям.
      value_type: text
