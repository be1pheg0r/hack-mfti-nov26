# The caller supplies ready vectors; this command never embeds or parses data.
backend: milvus
uri: http://127.0.0.1:19530
collection_name: vectors
token_file: .data/milvus/token
operation: search
record_id: ""
record_ids: null
vector: []
dimension: 384
limit: 5
hydra:
  run:
    dir: .data/vector_store/runs/${now:%Y-%m-%d_%H-%M-%S}
  job:
    chdir: false
