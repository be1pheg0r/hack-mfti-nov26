[project]
name = "mfti-hack"
version = "0.1.0"
description = "Resume and vacancy matching hackathon project"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3,<2",
    "openrouter>=1,<2",
    "pydantic>=2,<3",
    "python-docx>=1.2,<2",
    "python-dotenv>=1,<2",
    "rank-bm25>=0.2.2,<0.3",
    "pymilvus>=2.6,<2.7",
    "tantivy>=0.25,<0.27",
]

[project.optional-dependencies]
legacy-migration = ["sqlite-vec>=0.1.6,<1"]
embeddings = [
    "pillow>=11",
    "sentence-transformers>=6.1,<7",
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=5.18,<6",
]

[dependency-groups]
dev = [
    "ipykernel>=6,<8",
    "isort>=6,<7",
    "jupyterlab>=4,<5",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "pytest-xdist>=3.6,<4",
    "ruff>=0.11,<1",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", ".docs", ".data"]

[tool.ruff.lint]
select = ["E", "F"]

[tool.isort]
profile = "black"
line_length = 88
skip = [".venv", ".docs", ".data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-n 4"
